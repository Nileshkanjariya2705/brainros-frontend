<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="0.5" stop-color="#1E1B4B" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818CF8" />
      <stop offset="1" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle glow circles -->
  <circle cx="200" cy="150" r="300" fill="#4338CA" fill-opacity="0.25" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="350" fill="#6B21A8" fill-opacity="0.2" filter="blur(90px)" />

  <!-- Top Logo & Brand Bar -->
  <g transform="translate(100, 80)">
    <rect width="64" height="64" rx="18" fill="url(#logoGrad)" />
    <path d="M20 32L30 42L46 22" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="82" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">BRAINROS</text>
    <rect x="270" y="16" width="130" height="32" rx="16" fill="#312E81" stroke="#4338CA" stroke-width="1.5" />
    <text x="335" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#A5B4FC" text-anchor="middle" letter-spacing="1.5">EXAM ENGINE</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="270" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" fill="#FFFFFF" letter-spacing="-1">
    Smarter Online Exams.
  </text>
  <text x="100" y="340" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="54" fill="url(#textGrad)" letter-spacing="-1">
    Better Student Performance.
  </text>

  <!-- Subtitle -->
  <text x="100" y="415" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
    All-in-one assessment ecosystem for JEE, NEET &amp; CET.
  </text>
  <text x="100" y="450" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
    Official NTA test simulation, AI regional translations &amp; instant percentile rank analytics.
  </text>

  <!-- Badges -->
  <g transform="translate(100, 510)">
    <!-- Badge 1: NTA Pattern -->
    <rect x="0" y="0" width="170" height="42" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="85" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#E2E8F0" text-anchor="middle">🎯 NTA Pattern Mocks</text>

    <!-- Badge 2: 9 Languages -->
    <rect x="185" y="0" width="190" height="42" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="280" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#E2E8F0" text-anchor="middle">🌐 9 Regional Languages</text>

    <!-- Badge 3: JEE NEET CET -->
    <rect x="390" y="0" width="180" height="42" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="480" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#E2E8F0" text-anchor="middle">⚡ JEE • NEET • CET</text>

    <!-- Badge 4: URL -->
    <rect x="780" y="0" width="220" height="42" rx="12" fill="#4338CA" />
    <text x="890" y="26" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle">www.brainros.com</text>
  </g>
</svg>
